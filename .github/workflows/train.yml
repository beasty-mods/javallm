name: Train Chat Model

# Adds a manual "Run workflow" button on the Actions tab. No GPU involved on
# purpose — this project has no GPU code path (see README), so a GitHub-hosted
# CPU runner (2 modern cores) is the right fit, and is likely much faster
# per-core than an older local machine even though it's only 2 cores.
on:
  workflow_dispatch:
    inputs:
      corpus_path:
        description: "Corpus file, relative to the repo root (e.g. data/sample_corpus.txt)"
        required: false
        default: "data/sample_corpus.txt"
      epochs:
        description: "Training epochs"
        required: false
        default: "60"
      context_size:
        description: "Context window size, in words"
        required: false
        default: "6"
      embed_dim:
        description: "Embedding dimension"
        required: false
        default: "32"
      hidden_size:
        description: "Hidden layer size"
        required: false
        default: "128"
      learning_rate:
        description: "Initial learning rate"
        required: false
        default: "0.08"
      min_freq:
        description: "Drop words seen fewer than this many times (become <unk>)"
        required: false
        default: "1"
      threads:
        description: "Training threads (leave blank to auto-use all runner cores)"
        required: false
        default: ""
      commit_model:
        description: "Commit the trained model.bin back into the repo?"
        type: boolean
        required: false
        default: false

# Only needed so the optional "commit model back to repo" step can push.
permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Show the runner's CPU (for reference)
        run: nproc

      - name: Compile the model (core) and the console UI
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out core/src/main/java/com/chatllm/core/*.java
          javac -encoding UTF-8 -d out -cp out ui/src/main/java/com/chatllm/ui/*.java

      - name: Train
        run: |
          ARGS=(
            "${{ inputs.corpus_path }}"
            "model.bin"
            "${{ inputs.epochs }}"
            "${{ inputs.context_size }}"
            "${{ inputs.embed_dim }}"
            "${{ inputs.hidden_size }}"
            "${{ inputs.learning_rate }}"
            "${{ inputs.min_freq }}"
          )
          if [ -n "${{ inputs.threads }}" ]; then
            ARGS+=("${{ inputs.threads }}")
          fi
          java -cp out com.chatllm.core.Trainer "${ARGS[@]}"

      - name: Upload trained model as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: model.bin

      - name: Commit model.bin back into the repo (only if requested above)
        if: ${{ inputs.commit_model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model.bin
          git commit -m "Retrain model via workflow_dispatch" || echo "No changes to commit"
          git push
